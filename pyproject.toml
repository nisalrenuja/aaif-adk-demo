# Lint configuration. There is no build here on purpose: this repo is a set of
# runnable teaching examples, not an installable package. Each phase folder is
# meant to be copied out and run on its own.

[tool.ruff]
target-version = "py310"          # the minimum this project supports
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes: unused imports, undefined names
    "I",    # import sorting
    "UP",   # pyupgrade: outdated syntax
    "B",    # bugbear: likely bugs
    "SIM",  # simplifiable code
    "ARG",  # unused arguments: caught a tool advertising a parameter it ignored
    "RET",  # return-statement consistency
    "PIE",  # misc lint
    "C4",   # comprehension style
    "RUF",  # ruff's own rules, including stale noqa directives
]

[tool.ruff.lint.per-file-ignores]
# These are command line demos. Printing is the entire point of them, so T201 is
# not selected at all rather than suppressed file by file.

# The offline loop test asserts, which is what a test is for.
"agents/*/test_budget_loop.py" = ["S101"]
# Mock inventory is a data table. One record per line is easier to read and to
# edit than a wrapped dict, which matters more here than the column limit.
"agents/*/mock_data.py" = ["E501"]
"local_expert_service/agent.py" = ["E501"]
# The seeded trip in run_booking is a data table too.
"agents/*/run_booking.py" = ["E501", "E402"]

# These modules call warnings.filterwarnings() before importing ADK, on purpose,
# so the stage terminal stays readable. That is what E402 is complaining about.
"agents/*/agent.py" = ["E402"]
"agents/*/_runner.py" = ["E402"]
"agents/*/show_models.py" = ["E402"]
"agents/*/measure_cost.py" = ["E402"]
"agents/*/workflow_graph.py" = ["E402"]
"agents/*/remote.py" = ["E402"]
"local_expert_service/server.py" = ["E402"]


# The offline test suite. `pytest` from the repo root runs everything; the three
# subprocess tests that prove `.env.models` reaches the agents are marked slow
# because they each pay a cold ADK import.
#
#     pytest                    everything, about five seconds
#     pytest -m "not slow"      skip the subprocess handover tests
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: spawns a subprocess and pays a cold ADK import",
]
# ADK 2.5 emits this on import of anything agent shaped. The repo already silences
# it in the run scripts so the stage terminal stays readable; the same applies to
# test output, and the deprecation is documented in agents/*/agent.py.
filterwarnings = [
    "ignore:BaseAgentConfig is deprecated:DeprecationWarning",
]
